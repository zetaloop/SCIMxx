name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "$version" != "$package_version" ]]; then
            echo "Version $version does not match Cargo.toml version $package_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release

      - name: Package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          archive="scimxx-v$VERSION-macos-arm64e.tar.gz"
          tar -C target/arm64e-apple-darwin/release -czf "$archive" scimxx libscimxx_hook.dylib
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "$TAG" "$ARCHIVE" --generate-notes --target "$GITHUB_SHA" --title "SCIMxx $TAG"
